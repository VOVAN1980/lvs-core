[package]
name = "lvs-core-rs"
version = "0.1.0"
edition = "2021"
authors = ["LVS Project"]
description = "LVS Core Engine — Rust implementation of Drift-Based Value Layer"
license = "MIT"

[lib]
name = "lvs_core"
path = "src/lib.rs"

# ---- Binaries ----

[[bin]]
name = "lvs-sim"
path = "bin/lvs-sim.rs"

[[bin]]
name = "lvs-node"
path = "bin/lvs-node.rs"

[[bin]]
name = "lvs-gateway"
path = "bin/lvs-gateway.rs"

# ---- Dependencies ----

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

# сеть
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-tungstenite = { version = "0.21", features = ["tokio-native-tls"] }
lazy_static = "1.4"
axum = { version = "0.7", features = ["ws"] }
